<!doctype html>
<html><head><meta charset="utf-8"><title>ExampleCo – Ashby mock (JSA-208 / JSA-209)</title></head>
<body>
<!-- Offline mock of an Ashby application form (fictional): a react-datepicker-like date box that rewrites what is typed to
     MM/DD/YYYY when it closes, an Education History School type-ahead that keeps only a PICKED option once it loses focus,
     and the red "Your form needs corrections" box after Submit. Query: ?noschool = the list never has the school;
     ?nodegree = no Degree box and only the end-date selects; ?deadclick = clicking an option does nothing (the pick never registers). -->
<div id="errors"></div>
<form id="f" onsubmit="return false">
  <div class="_fieldEntry_mock"><label for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name"></div>
  <div class="_fieldEntry_mock"><label for="d1">When is your earliest availability to start?</label><input id="d1" name="d1" placeholder="MM/DD/YYYY"></div>
  <div class="_fieldEntry_mock"><label>School</label>
    <input id="school" role="combobox" placeholder="Search schools..." autocomplete="off">
    <div id="list" role="listbox"></div>
    <input id="_systemfield_education_history-degree" placeholder="e.g. Bachelor of Science">
    <input id="_systemfield_education_history-major" placeholder="e.g. Computer Science">
    <select><option></option><option>September</option></select><select><option></option><option>2026</option></select>
    <select><option></option><option>December</option></select><select><option></option><option>2027</option></select>
    <input type="checkbox" id="_systemfield_education_history-isCurrent">
  </div>
  <button type="button" id="submit">Submit Application</button>
</form>
<script>
const q = new URLSearchParams(location.search);
if (q.has('nodegree')) {   // JSA-330 (ibotta): the form config excludes degree and start date → no Degree box, one date pair
  document.getElementById('_systemfield_education_history-degree').remove();
  const sel = document.querySelectorAll('select'); sel[0].remove(); sel[1].remove();
}
const SCHOOLS = q.has('noschool') ? ['Loyola University Chicago', 'Chicago State University']
  : ['University of Chicago Booth School of Business', 'The University of Chicago', 'Loyola University Chicago'];
const pad = n => String(n).padStart(2, '0');
const d1 = document.getElementById('d1');
function closeDate() {                       // react-datepicker shows whatever date it parsed as MM/DD/YYYY
  const t = Date.parse(d1.value);
  if (!isNaN(t)) { const d = new Date(t); d1.value = `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`; }
}
d1.addEventListener('keydown', e => { if (e.key === 'Escape') closeDate(); });
d1.addEventListener('blur', closeDate);
const school = document.getElementById('school'), list = document.getElementById('list');
let picked = '';
school.addEventListener('input', () => {
  picked = ''; list.innerHTML = '';
  const v = school.value.toLowerCase();
  if (!v) return;
  for (const s of SCHOOLS.filter(x => x.toLowerCase().includes(v.split(' ')[0]))) {
    const o = document.createElement('div'); o.setAttribute('role', 'option'); o.textContent = s;
    o.addEventListener('mousedown', e => e.preventDefault());
    o.addEventListener('click', () => { if (q.has('deadclick')) return; picked = s; school.value = s; list.innerHTML = ''; });
    list.appendChild(o);
  }
});
school.addEventListener('blur', () => { if (!picked) { school.value = ''; } list.innerHTML = ''; });
document.getElementById('submit').addEventListener('click', () => {
  if (!picked) {
    document.getElementById('errors').innerHTML = '<div><h4>Your form needs corrections</h4><ul><li>Missing entry for required field: <a href="#school">School</a></li></ul></div>';
    return;
  }
  document.body.innerHTML = '<h2>Thank you for applying!</h2><p>Your application has been submitted.</p>';
});
</script>
</body></html>
