# Public repo CI (JSA-080): every offline test on macOS (the agent is macOS-only). Copied to .github/workflows/ci.yml by
# scripts/public/export_public.py; the private repo does not run it.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: |
          python -m venv ~/.job-agent-venv
          ~/.job-agent-venv/bin/python -m pip install -r requirements.txt
          ~/.job-agent-venv/bin/python -m playwright install chromium
          npm install --no-audit --no-fund
          python3 skills/auto-apply/scripts/build_bundle.py
      - name: Test
        run: scripts/test_all.sh
